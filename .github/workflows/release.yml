name: release

# Tag push (v*) builds, signs and publishes a GitHub release plus the Homebrew
# cask. A manual run builds a snapshot only (nothing is published or signed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Apple silicon host: darwin builds natively with clang, linux and
    # windows cross-compile with zig (see .goreleaser.yaml).
    runs-on: macos-15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # cosign keyless signing (GitHub OIDC)
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full history and tags for the changelog

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # cached explicitly below together with zig's cache

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false

      - name: Resolve cache paths
        id: paths
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"
          echo "zigcache=$RUNNER_TEMP/zig-cache" >> "$GITHUB_OUTPUT"

      # cgo grammar compilation for five targets is the slow part of a release.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.paths.outputs.gocache }}
            ${{ steps.paths.outputs.gomodcache }}
            ${{ steps.paths.outputs.zigcache }}
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            release-${{ runner.os }}-${{ runner.arch }}-

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Test install.sh
        run: |
          shellcheck -s sh install.sh scripts/*.sh
          sh scripts/install_test.sh

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Snapshot build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.15.3
          args: release --snapshot --clean --skip=publish,sign

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.15.3
          # Without the tap token the release still publishes; the cask is
          # then pushed to pragmataW/homebrew-tap by hand.
          args: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN != '' && 'release --clean' || 'release --clean --skip=homebrew' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on pragmataW/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Verify artifacts
        run: sh scripts/verify-dist.sh dist

      - name: Upload snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
